name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '**/*.csproj'
              - '**/*.slnx'
              - '**/packages.lock.json'
              - 'Directory.*.props'
              - 'global.json'
              - 'coverage.runsettings'
              - '.github/workflows/**'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Block risky logging
        run: |
          if git grep -nE 'EnableSensitiveDataLogging|UseHttpLogging|AddHttpLogging|\{@' -- 'src/*.cs'; then
            echo "::error::Risky logging found"
            exit 1
          fi
      - name: Block hard deletes on soft-delete entities
        run: |
          if git grep -nE '\.(Products|Employees|Showrooms)\b.*ExecuteDelete' -- 'src/*.cs'; then
            echo "::error::Use Remove + SaveChanges for soft-delete entities"
            exit 1
          fi
      - name: Block stock writes outside StockService
        run: |
          if git grep -nE 'WarehouseStocks\.(Add|AddRange|Update|Remove|RemoveRange)\(|(INSERT INTO|UPDATE) "(WarehouseStocks|StockMovements)"|StockMovements\.(Add|AddRange|Update|Remove|RemoveRange)\(' \
               -- 'src/*.cs' ':!src/ErpDashboard.Api/Features/Inventory/Stock/StockService.cs' ':!src/ErpDashboard.Api/Migrations/*'; then
            echo "::error::Change stock only through IStockService"
            exit 1
          fi
      - name: Block UTC-based business dates
        run: |
          if git grep -nE 'DateOnly\.FromDateTime\(DateTime\.|ToDateTime\(TimeOnly\.MinValue, DateTimeKind\.Utc\)' \
               -- 'src/*.cs' ':!src/ErpDashboard.Api/Common/BusinessClock.cs' ':!src/ErpDashboard.Api/Migrations/*'; then
            echo "::error::Use IBusinessClock for business dates"
            exit 1
          fi
      - name: Keep the payment provider in one place
        run: |
          if git grep -niI 'paymob' -- src \
          ':!src/ErpDashboard.Api/Infrastructure/Payments/Paymob/*' \
          ':!src/ErpDashboard.Api/Infrastructure/Payments/PaymentProviders.cs' \
          ':!src/**/appsettings*.json'; then
            echo "::error::Payment provider names belong in Infrastructure/Payments/<Provider> only"
            exit 1
          fi
      - name: Keep the WhatsApp provider in one place
        run: |
          if git grep -niI 'openwa' -- src \
          ':!src/ErpDashboard.Api/Infrastructure/Messaging/OpenWa/*' \
          ':!src/ErpDashboard.Api/Infrastructure/Messaging/MessagingProviders.cs' \
          ':!src/**/appsettings*.json'; then
            echo "::error::WhatsApp provider names belong in Infrastructure/Messaging/<Provider> only"
            exit 1
          fi

      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release

      - name: Test (with coverage)
        run: >
          dotnet test --no-build -c Release
          --logger trx --results-directory TestResults
          --settings coverage.runsettings --collect:"XPlat Code Coverage"

      - name: Fail if no tests ran
        run: |
          total=$(cat TestResults/*.trx | grep -oP '<Counters total="\K[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "Tests executed: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::No tests were executed"
            exit 1
          fi

      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub;Html

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/SummaryGithub.md') != '' }}
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('coverage/**') != '' }}
        with:
          name: coverage
          path: coverage