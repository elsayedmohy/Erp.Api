name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults

      - name: Fail if no tests ran
        run: |
          total=$(cat TestResults/*.trx | grep -oP '<Counters total="\K[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "Tests executed: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::No tests were executed"
            exit 1
          fi
