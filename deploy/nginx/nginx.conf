worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;                      # no nginx version in headers or error pages
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;                # same as Kestrel's limit

    # Docker's DNS: resolve "api" again if the container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s;

    log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent '
                    '${request_time}s upstream=${upstream_response_time}s';
    access_log /dev/stdout main;            # $uri, not $request_uri: no query strings in the log
    error_log /dev/stderr warn;

    gzip on;
    gzip_types application/json application/problem+json;

    upstream api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        location = /health/live { proxy_pass http://api; }   # for a load balancer that only speaks HTTP
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/erp.crt;
        ssl_certificate_key /etc/nginx/certs/erp.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwrite, never append: a client cannot smuggle its own X-Forwarded-For in.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $request_id;
            proxy_read_timeout 60s;
        }
    }
}
