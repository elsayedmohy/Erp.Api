services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  api:
    build:
      context: .
      dockerfile: src/ErpDashboard.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=erp_db;Username=erp;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: ErpDashboard
      Jwt__Audience: ErpDashboard
      Jwt__DurationInMinutes: "15"
      Jwt__ExpiryDays: "7"
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@company.com}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
      ApiSettings__BaseUrl: http://localhost:5013
      Cors__AllowedOrigins__0: http://localhost:4200
      Finance__DefaultTaxRate: 14
      Finance__DefaultDueDays: 30
    ports:
      - "5013:8080"
  
  
  
volumes:
  postgres-data: